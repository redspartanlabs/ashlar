spring.application.name=ashlar-showcase

# Deliberately NOT the root path. The whole point of the slice's asset check
# is that Ashlar's component-emitted script URLs stay correct for an
# application that is not mounted at "/", so the showcase runs under one by
# default and proves it rather than assuming it.
server.servlet.context-path=/myapp

# Templates are generated at build time from the staged JTE source root (see
# showcase/build.gradle.kts) and compiled into this application, so JTE must
# resolve them as precompiled classes rather than by reading a directory at
# runtime. This is the real consumer path: nothing looks for .jte files on
# disk once the application is packaged.
gg.jte.development-mode=false
gg.jte.use-precompiled-templates=true
