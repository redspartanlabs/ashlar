# Development profile - activate with --spring.profiles.active=dev
#
# JTE resolves templates from a directory at runtime and recompiles them on
# change, instead of using the classes generated at build time. The directory
# is the staged root, NOT src/main/jte, because that is the only place where
# this application's templates and Ashlar's extracted templates exist together
# - the same single-root limitation the Gradle plugin has.
#
# Consequence, and the thing under test: edits to src/main/jte are not visible
# until assembleJteSources re-stages them.
gg.jte.development-mode=true
gg.jte.use-precompiled-templates=false
gg.jte.template-location=build/jte-sources
