<!doctype html>
<!-- TEST-ONLY. The PRE-MIGRATION Tailwind class strings of Tabs and Tab Panel, read verbatim from the templates at the commit before the migration.
     It is never served. Tailwind compiles this file (see tabs-oracle-entry.css and tabs-legacy-scoped-entry.css) so the legacy rendering stays reproducible, and the
     tests read the class strings back out of it, so there is one source of truth for what "legacy" means. A tab is active or inactive by its aria-selected. The legacy
     panel also carried the Tailwind `hidden` class while inactive; the migrated panel carries the native `hidden` attribute instead, so the rewrite keeps the attribute
     (display: none either way) and writes the always-present classes below. The root, the tab label and the icon size had no class strings of their own. -->
<span data-legacy-role="tabs-list" class="flex flex-wrap gap-1 border-b border-slate-200 dark:border-slate-700"></span>
<span data-legacy-role="tab-active" class="inline-flex items-center gap-2 border-b-2 px-3 py-2.5 text-sm font-medium transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:text-slate-300 disabled:hover:text-slate-300 disabled:hover:border-transparent dark:disabled:text-slate-600 dark:disabled:hover:text-slate-600 border-blue-600 text-blue-600 hover:text-blue-700 dark:border-blue-500 dark:text-blue-400 dark:hover:text-blue-300"></span>
<span data-legacy-role="tab-inactive" class="inline-flex items-center gap-2 border-b-2 px-3 py-2.5 text-sm font-medium transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:text-slate-300 disabled:hover:text-slate-300 disabled:hover:border-transparent dark:disabled:text-slate-600 dark:disabled:hover:text-slate-600 border-transparent text-slate-500 hover:border-slate-300 hover:text-slate-700 dark:text-slate-400 dark:hover:border-slate-600 dark:hover:text-slate-200"></span>
<span data-legacy-role="tab-badge" class="inline-flex min-w-5 items-center justify-center rounded-full bg-slate-100 px-1.5 py-0.5 text-xs font-medium text-slate-600 dark:bg-slate-800 dark:text-slate-300"></span>
<span data-legacy-role="tab-panel" class="py-4 text-sm text-slate-700 dark:text-slate-300"></span>
