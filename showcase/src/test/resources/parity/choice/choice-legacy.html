<!doctype html>
<!-- TEST-ONLY. The PRE-MIGRATION Tailwind class strings of Checkbox and Radio Group, read verbatim from the templates at commit 0c26bc2 (the commit before the Choice Controls PR 1
     migration) by evaluating the same string expressions the templates used. It is never served. Tailwind compiles this file (see choice-oracle-entry.css and
     choice-legacy-scoped-entry.css) so the legacy rendering stays reproducible, and the tests read the class strings back out of it: one source of truth for what "legacy" means.
     Variants the templates chose from their parameters: a Radio Group's orientation (two option-layout strings) and, per option, the disabled state of the label and the
     description (a label and a description each have an enabled and a disabled string; the template chose by "the group is disabled OR the option is disabled"). -->
