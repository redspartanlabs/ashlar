<!doctype html>
<!-- TEST-ONLY. The PRE-MIGRATION Tailwind class strings of Modal and Drawer, read verbatim from the templates, helpers and scripts at commit b4418e2 (the commit before the
     Modal and Drawer migration): modal.jte lines 25-68 with ModalSize.maxWidthClass(), drawer.jte lines 55-99 with DrawerStyles.alignment(), border() and closedTransform(), and the
     classes modal.js and drawer.js toggled at run time. It is never served. Tailwind compiles this file (see overlay-oracle-entry.css and overlay-legacy-scoped-entry.css) so the
     legacy rendering stays reproducible, and the tests read the class strings back out of it: one source of truth for what "legacy" means.
     Variants the templates chose from their parameters: the dialog's max width (size Small, Medium, Large) and the drawer's edge (placement Left, Right), which decided the root's
     alignment, the panel's border side and its closed transform. The state roles are what the scripts did: the root swapped hidden for flex while shown, and the backdrop, the
     dialog and the panel swapped their closed classes for the open ones (the closed classes are part of the template strings above). -->
