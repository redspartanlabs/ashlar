<!doctype html>
<!-- TEST-ONLY. The Tailwind classes of Button's parts that are not variant or size dependent, as the template wrote them before the migration.
     The variant, size and state classes of the <button> itself come from ButtonLegacyStyles (a copy of the former ButtonStyles). The Tailwind
     oracle scans this file and that class so these classes stay compiled. -->
<span data-legacy-role="spinner-shown" class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-current border-t-transparent"></span>
<span data-legacy-role="spinner-hidden" class="hidden h-4 w-4 animate-spin rounded-full border-2 border-current border-t-transparent"></span>
<span data-legacy-role="icon-hidden" class="hidden"></span>
<span data-legacy-role="sr-only" class="sr-only"></span>
<span data-legacy-role="pointer-events-none" class="pointer-events-none"></span>
