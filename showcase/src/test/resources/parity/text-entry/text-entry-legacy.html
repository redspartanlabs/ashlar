<!doctype html>
<!-- TEST-ONLY. The PRE-MIGRATION Tailwind class strings of Form Field, Text Input, Number Input, Textarea and Search Input, read verbatim from the templates at commit 831a2f5
     (the commit before the Text Entry migration) by evaluating the same string expressions the templates used (the padding, resize and display variants are applied by
     TextEntryLegacyMarkup, the same way the templates chose them). It is never served. Tailwind compiles this file (see text-entry-oracle-entry.css and
     text-entry-legacy-scoped-entry.css) so the legacy rendering stays reproducible, and the tests read the class strings back out of it: one source of truth for what "legacy" means.
     Variants: a text input's padding was pl-3/pl-9 and pr-3/pr-9 (never both pl and pr in one string); a textarea was resize-y or resize-none; the search clear button carried
     "flex" with a value and "hidden" without; the character count carried the red pair at its limit instead of the slate pair. -->
