<!doctype html>
<!-- TEST-ONLY. The Timeline's and the Timeline Item's PRE-MIGRATION markup: the exact Tailwind class strings timeline.jte,
     timeline-item.jte and TimelineStyles rendered before they moved to ash-timeline and ash-timeline-item. It is never served.

     It has two jobs. Tailwind compiles this file (see timeline-oracle-entry.css and timeline-legacy-scoped-entry.css), so the legacy
     rendering stays reproducible after the templates stop emitting these classes (the marker colours were generated by Java, which
     Tailwind no longer sees them in). And the tests read the class strings back out of it, so there is one source of truth for what
     "legacy" means.

     Each marker role is the marker's shared classes plus its variant's colours, exactly the string TimelineStyles.marker returned.
     The visually hidden status text was Tailwind's sr-only. -->
<ol data-legacy-role="timeline" class="flex flex-col"></ol>
<li data-legacy-role="item" class="group relative flex gap-4 pb-8 last:pb-0"></li>
<div data-legacy-role="rail" class="relative flex w-8 shrink-0 flex-col items-center"></div>
<span data-legacy-role="marker-neutral" class="relative z-10 flex h-8 w-8 shrink-0 items-center justify-center rounded-full border-2 border-slate-300 bg-white text-slate-400 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-500"></span>
<span data-legacy-role="marker-info" class="relative z-10 flex h-8 w-8 shrink-0 items-center justify-center rounded-full border-2 border-sky-500 bg-sky-50 text-sky-600 dark:border-sky-500 dark:bg-sky-950 dark:text-sky-400"></span>
<span data-legacy-role="marker-success" class="relative z-10 flex h-8 w-8 shrink-0 items-center justify-center rounded-full border-2 border-green-500 bg-green-50 text-green-600 dark:border-green-500 dark:bg-green-950 dark:text-green-400"></span>
<span data-legacy-role="marker-warning" class="relative z-10 flex h-8 w-8 shrink-0 items-center justify-center rounded-full border-2 border-amber-500 bg-amber-50 text-amber-600 dark:border-amber-500 dark:bg-amber-950 dark:text-amber-400"></span>
<span data-legacy-role="marker-danger" class="relative z-10 flex h-8 w-8 shrink-0 items-center justify-center rounded-full border-2 border-red-500 bg-red-50 text-red-600 dark:border-red-500 dark:bg-red-950 dark:text-red-400"></span>
<div data-legacy-role="connector" class="absolute -bottom-8 top-8 w-0.5 bg-slate-200 group-last:hidden dark:bg-slate-700"></div>
<div data-legacy-role="body" class="min-w-0 flex-1 pb-1 pt-1"></div>
<p data-legacy-role="date" class="text-xs font-medium text-slate-500 dark:text-slate-400"></p>
<p data-legacy-role="title" class="mt-0.5 break-words text-sm font-semibold text-slate-900 dark:text-slate-100"></p>
<div data-legacy-role="content" class="mt-1 break-words text-sm text-slate-600 dark:text-slate-300"></div>
<span data-legacy-role="status" class="sr-only"></span>
