<!doctype html>
<!-- TEST-ONLY. The Stepper's and the Stepper Item's PRE-MIGRATION markup: the exact Tailwind class strings stepper.jte, stepper-item.jte and
     StepperStyles rendered before they moved to ash-stepper and ash-stepper-item. It is never served.

     It has two jobs. Tailwind compiles this file (see stepper-oracle-entry.css and stepper-legacy-scoped-entry.css), so the legacy rendering
     stays reproducible after the templates stop emitting these classes (the indicator, line and label colours were generated by Java, which
     Tailwind no longer sees them in). And the tests read the class strings back out of it, so there is one source of truth for what "legacy"
     means.

     The indicator, the line and the label each have one string per state, exactly what StepperStyles returned for it. The indicator of a
     step that is not completed also carried before:content-[counter(step)], which drew the step's number. The visually hidden status text was
     Tailwind's sr-only. The <li> had the same classes for every state. -->
<div data-legacy-role="stepper" class="@container"></div>
<ol data-legacy-role="list" class="flex flex-col gap-6 @sm:flex-row @sm:gap-0 [counter-reset:step]"></ol>
<li data-legacy-role="item" class="group relative flex min-w-0 flex-1 items-start gap-3 [counter-increment:step] @sm:flex-col @sm:items-center @sm:gap-2"></li>
<div data-legacy-role="connector" class="absolute left-0 right-0 top-4 hidden items-center @sm:flex @sm:group-last:hidden"></div>
<div data-legacy-role="line-completed" class="h-0.5 w-full bg-blue-600 dark:bg-blue-500"></div>
<div data-legacy-role="line-current" class="h-0.5 w-full bg-slate-200 dark:bg-slate-700"></div>
<div data-legacy-role="line-upcoming" class="h-0.5 w-full bg-slate-200 dark:bg-slate-700"></div>
<span data-legacy-role="indicator-completed" class="relative z-10 flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-sm font-semibold border-2 border-blue-600 bg-blue-600 text-white dark:border-blue-500 dark:bg-blue-500"></span>
<span data-legacy-role="indicator-current" class="relative z-10 flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-sm font-semibold border-2 border-blue-600 bg-white text-blue-600 dark:border-blue-500 dark:bg-slate-900 dark:text-blue-400 before:content-[counter(step)]"></span>
<span data-legacy-role="indicator-upcoming" class="relative z-10 flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-sm font-semibold border-2 border-slate-300 bg-white text-slate-400 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-500 before:content-[counter(step)]"></span>
<span data-legacy-role="text" class="flex min-w-0 flex-col pt-1 @sm:items-center @sm:pt-0 @sm:text-center"></span>
<span data-legacy-role="label-completed" class="break-words text-sm text-slate-700 dark:text-slate-300"></span>
<span data-legacy-role="label-current" class="break-words text-sm font-semibold text-slate-900 dark:text-slate-100"></span>
<span data-legacy-role="label-upcoming" class="break-words text-sm text-slate-400 dark:text-slate-500"></span>
<span data-legacy-role="status" class="sr-only"></span>
