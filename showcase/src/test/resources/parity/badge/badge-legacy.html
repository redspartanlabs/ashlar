<!doctype html>
<!-- TEST-ONLY. The Badge's PRE-MIGRATION markup: the exact Tailwind class strings the
     component rendered before it moved to ash-badge. It is never served.

     It has two jobs. Tailwind compiles this file (see badge-oracle-entry.css), so the
     legacy rendering stays reproducible after the component's own templates stop emitting
     these classes. And the tests read the class strings back out of it, so there is one
     source of truth for what "legacy" means. -->
<ul>
<li><span data-legacy-variant="neutral" class="inline-flex items-center gap-1 whitespace-nowrap rounded-full px-2 py-1 text-xs font-medium ring-1 ring-inset bg-slate-100 text-slate-600 ring-slate-500/20 dark:bg-slate-800 dark:text-slate-400 dark:ring-slate-500/30"></span></li>
<li><span data-legacy-variant="info" class="inline-flex items-center gap-1 whitespace-nowrap rounded-full px-2 py-1 text-xs font-medium ring-1 ring-inset bg-sky-50 text-sky-700 ring-sky-600/20 dark:bg-sky-950 dark:text-sky-300 dark:ring-sky-500/30"></span></li>
<li><span data-legacy-variant="success" class="inline-flex items-center gap-1 whitespace-nowrap rounded-full px-2 py-1 text-xs font-medium ring-1 ring-inset bg-green-50 text-green-700 ring-green-600/20 dark:bg-green-950 dark:text-green-300 dark:ring-green-500/30"></span></li>
<li><span data-legacy-variant="warning" class="inline-flex items-center gap-1 whitespace-nowrap rounded-full px-2 py-1 text-xs font-medium ring-1 ring-inset bg-amber-50 text-amber-700 ring-amber-600/20 dark:bg-amber-950 dark:text-amber-300 dark:ring-amber-500/30"></span></li>
<li><span data-legacy-variant="danger" class="inline-flex items-center gap-1 whitespace-nowrap rounded-full px-2 py-1 text-xs font-medium ring-1 ring-inset bg-red-50 text-red-700 ring-red-600/20 dark:bg-red-950 dark:text-red-300 dark:ring-red-500/30"></span></li>
<li><svg data-legacy-icon class="inline-block shrink-0 h-3 w-3"></svg></li>
</ul>
