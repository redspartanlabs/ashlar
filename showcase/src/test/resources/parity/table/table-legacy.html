<!doctype html>
<!-- TEST-ONLY. The PRE-MIGRATION Tailwind class strings of the Table family (Table, Table Column, Table Row, Table Cell; Data Table renders through them), read verbatim from
     table.jte, table-column.jte, table-row.jte and table-cell.jte at commit 37b02db (the commit before the Table migration) by taking each class attribute, each class the
     templates built in a local, and the Icon size classes. It is never served. Tailwind compiles this file (see table-oracle-entry.css and table-legacy-scoped-entry.css) so the
     legacy rendering stays reproducible, and the tests read the class strings back out of it: one source of truth for what "legacy" means.

     Strings the templates built from parts are kept as their parts, joined exactly as the templates joined them: a column is "px-4 py-2.5 " + alignment + the caller's width + " font-semibold
     ...", a cell is "px-4 py-2.5 " + alignment + the mono part + the wrap part + a tail that differs for a row header and an ordinary cell. table-legacy.js beside this file is the
     original table.js, byte for byte. -->
