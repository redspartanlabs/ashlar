<!doctype html>
<!-- TEST-ONLY. The Skeleton's PRE-MIGRATION markup: the exact Tailwind class strings skeleton.jte and SkeletonStyles rendered before
     the Skeleton moved to ash-skeleton. It is never served.

     It has two jobs. Tailwind compiles this file (see skeleton-oracle-entry.css and skeleton-legacy-scoped-entry.css), so the
     legacy rendering stays reproducible after the component stops emitting these classes. And the tests read the class
     strings back out of it, so there is one source of truth for what "legacy" means. -->
<div data-legacy-role="rectangle" class="block shrink-0 animate-pulse bg-slate-200 motion-reduce:animate-none dark:bg-slate-700 rounded"></div>
<div data-legacy-role="rounded" class="block shrink-0 animate-pulse bg-slate-200 motion-reduce:animate-none dark:bg-slate-700 rounded-full"></div>
