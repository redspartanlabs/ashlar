<!doctype html>
<!-- TEST-ONLY. The Progress's PRE-MIGRATION markup: the exact Tailwind class strings the component rendered before it
     moved to ash-progress (ProgressStyles.track and fill, plus the strings progress.jte wrote itself). It is never
     served.

     It has two jobs. Tailwind compiles this file (see progress-oracle-entry.css and progress-legacy-scoped-entry.css),
     so the legacy rendering stays reproducible after the component's own templates stop emitting these classes. And
     the tests read the class strings back out of it, so there is one source of truth for what "legacy" means. -->
<div data-legacy-role="wrapper" class="w-full"></div>
<div data-legacy-role="header-between" class="mb-1.5 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm justify-between"></div>
<div data-legacy-role="header-end" class="mb-1.5 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm justify-end"></div>
<span data-legacy-role="label" class="font-medium text-slate-700 dark:text-slate-300"></span>
<span data-legacy-role="value" class="text-slate-500 dark:text-slate-400"></span>
<div data-legacy-role="track-small" class="w-full overflow-hidden rounded-full bg-slate-200 dark:bg-slate-700 h-1.5"></div>
<div data-legacy-role="track-medium" class="w-full overflow-hidden rounded-full bg-slate-200 dark:bg-slate-700 h-2"></div>
<div data-legacy-role="track-large" class="w-full overflow-hidden rounded-full bg-slate-200 dark:bg-slate-700 h-3"></div>
<div data-legacy-role="fill" class="h-full rounded-full bg-blue-600 dark:bg-blue-500"></div>
