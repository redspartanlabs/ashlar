name: Release

# Publishes the library to Maven Central when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The workflow builds and tests the library, checks the tag matches the version
# in the build, signs the publication and uploads it to the Central Portal.
#
# The upload is left for a person to approve in the Central Portal (the
# deployment appears under https://central.sonatype.com/publishing/deployments).
# Maven Central releases are permanent, so the first release deliberately has
# that last human step. To release with no manual step, change
# publishToMavenCentral to publishAndReleaseToMavenCentral below.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   MAVEN_CENTRAL_USERNAME    Central Portal user token name
#   MAVEN_CENTRAL_PASSWORD    Central Portal user token password
#   SIGNING_KEY               ASCII-armored PGP private key (gpg --armor --export-secret-keys)
#   SIGNING_KEY_PASSWORD      passphrase of that key
#   ASHLAR_DEVELOPER_EMAIL    contact address published in the POM

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # A protected GitHub environment named maven-central, with required
    # reviewers, adds a second approval before the secrets are released to
    # this job. Create it in the repository settings; it is optional.
    environment: maven-central
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: The tag must match the version in the build
        run: |
          version=$(./gradlew -q :ashlar:properties --property version | sed -n 's/^version: //p')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the build version v${version}" >&2
            exit 1
          fi

      # Only the library module: it needs neither Node nor the showcase.
      - name: Build and test
        run: ./gradlew :ashlar:build

      - name: Sign and publish to the Central Portal
        run: ./gradlew :ashlar:publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_ashlarDeveloperEmail: ${{ secrets.ASHLAR_DEVELOPER_EMAIL }}
