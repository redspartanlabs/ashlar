name: CI

# Builds and tests everything - the library and the showcase - on every push to
# the main branches and on every pull request. Nothing here publishes anything
# and no secret is available to it.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # The showcase compiles its stylesheet with Tailwind, which needs Node.
      # The library module alone does not.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Timing evidence (experiment): the build below is the unchanged, unsharded one. These steps only record what it did, never decide its outcome (the job named
      # build still passes or fails with ./gradlew build alone), and publish the JUnit XML, Gradle's per-task profile and a manifest of the tests actually executed.
      - name: Record environment
        continue-on-error: true
        run: |
          {
            echo "### Environment"
            echo '```'
            echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "cpus: $(nproc)"
            grep -E 'MemTotal' /proc/meminfo
            echo "chrome: $(command -v google-chrome || echo none) $(google-chrome --version 2>/dev/null)"
            java -version 2>&1 | head -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - run: ./gradlew build --profile

      - name: Summarize test timings and executed tests
        if: always()
        continue-on-error: true
        run: node .github/scripts/test-manifest.mjs --out e2b-out --module ashlar=ashlar/build/test-results/test --module showcase=showcase/build/test-results/test

      - name: Upload timing evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2b-timing-and-manifest
          path: |
            e2b-out/
            build/reports/profile/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload JUnit XML reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: junit-xml
          path: |
            ashlar/build/test-results/test/*.xml
            showcase/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 30
